        // ==================== 畫布管理 ====================
        function initCanvas() {
            const container = document.getElementById('canvas-container');
            const frameLayer = document.getElementById('frame-layer');
            const nodeLayer = document.getElementById('node-layer');

            // 平移事件和取消選擇
            container.addEventListener('mousedown', (e) => {
                if (e.target === container || e.target === frameLayer || e.target === nodeLayer) {
                    // 如果在多選模式下，開始框選
                    if (isMultiSelectMode) {
                        isBoxSelecting = true;
                        const rect = container.getBoundingClientRect();
                        boxSelectStart = {
                            x: (e.clientX - rect.left - offsetX) / scale,
                            y: (e.clientY - rect.top - offsetY) / scale
                        };

                        // 創建選擇框元素
                        if (!selectionBox) {
                            selectionBox = document.createElement('div');
                            selectionBox.style.position = 'absolute';
                            selectionBox.style.border = '2px dashed var(--purple-color)';
                            selectionBox.style.background = 'rgba(155, 89, 182, 0.1)';
                            selectionBox.style.pointerEvents = 'none';
                            selectionBox.style.zIndex = '9999';
                            container.appendChild(selectionBox);
                        }
                        selectionBox.style.display = 'block';
                        return;
                    }

                    // 取消選擇元素
                    selectedElement = null;
                    updatePropertyEditor();
                    updateCopyPasteButtons(); // 更新複製貼上按鈕狀態

                    isPanning = true;
                    panStart = { x: e.clientX, y: e.clientY };
                    container.classList.add('grabbing');
                    renderCanvas(); // 重新渲染以移除選中狀態
                }
            });

            window.addEventListener('mousemove', (e) => {
                // 檢查多選模式下是否應該開始拖曳
                if (isMultiSelectMode && multiSelectClickStart && !isDragging && dragTarget) {
                    const dx = Math.abs(e.clientX - multiSelectClickStart.x);
                    const dy = Math.abs(e.clientY - multiSelectClickStart.y);
                    const distance = Math.sqrt(dx * dx + dy * dy);

                    // 如果移動距離超過5px，開始拖曳
                    if (distance > 5) {
                        isDragging = true;
                        multiSelectClickStart = null; // 清除點擊記錄
                    }
                }

                if (isBoxSelecting && selectionBox) {
                    // 更新框選矩形
                    const container = document.getElementById('canvas-container');
                    const rect = container.getBoundingClientRect();
                    const currentX = (e.clientX - rect.left - offsetX) / scale;
                    const currentY = (e.clientY - rect.top - offsetY) / scale;

                    const left = Math.min(boxSelectStart.x, currentX);
                    const top = Math.min(boxSelectStart.y, currentY);
                    const width = Math.abs(currentX - boxSelectStart.x);
                    const height = Math.abs(currentY - boxSelectStart.y);

                    // 應用變換
                    selectionBox.style.left = (left * scale + offsetX) + 'px';
                    selectionBox.style.top = (top * scale + offsetY) + 'px';
                    selectionBox.style.width = (width * scale) + 'px';
                    selectionBox.style.height = (height * scale) + 'px';
                } else if (isResizing && resizeTarget && resizeStartInfo) {
                    // 縮放元素 - 使用絕對位置計算，避免累積誤差
                    // 計算滑鼠相對於節點左上角的位移
                    const currentX = (e.clientX - offsetX) / scale;
                    const currentY = (e.clientY - offsetY) / scale;

                    // 由於是右下角縮放，可以直接用 (滑鼠位置 - 元素位置) 來計算新尺寸
                    // 考慮到鼠標在 resizeStart 時可能不在角落，我們使用差值
                    const deltaX = currentX - resizeStartInfo.startX;
                    const deltaY = currentY - resizeStartInfo.startY;

                    // 根據元素類型設置最小尺寸
                    const minWidth = resizeTarget.type === 'frame' ? 150 : 50;
                    const minHeight = resizeTarget.type === 'frame' ? 150 : 30;

                    const newWidth = Math.max(minWidth, resizeStartInfo.startWidth + deltaX);
                    const newHeight = Math.max(minHeight, resizeStartInfo.startHeight + deltaY);


                    resizeTarget.element.width = newWidth;
                    resizeTarget.element.height = newHeight;

                    renderCanvas();
                    updatePropertyEditor(); // 更新屬性編輯器中的尺寸顯示
                } else if (isDragging && dragTarget) {
                    // 拖曳元素
                    const dx = (e.clientX - dragStart.x) / scale;
                    const dy = (e.clientY - dragStart.y) / scale;

                    if (dragTarget.type === 'multi-select') {
                        // 多選拖曳：移動所有選中的元素
                        dragTarget.elements.forEach(el => {
                            if (el.type === 'node') {
                                const node = currentMapData.data.nodes.find(n => n.id === el.id);
                                if (node && dragOffsets[el.id]) {
                                    node.x = dragOffsets[el.id].x + dx;
                                    node.y = dragOffsets[el.id].y + dy;
                                }
                            } else if (el.type === 'frame') {
                                const frame = currentMapData.data.frames.find(f => f.id === el.id);
                                if (frame && dragOffsets[el.id]) {
                                    frame.x = dragOffsets[el.id].x + dx;
                                    frame.y = dragOffsets[el.id].y + dy;
                                }
                            }
                        });
                    } else {
                        // 單選拖曳
                        dragTarget.element.x = dragOffset.x + dx;
                        dragTarget.element.y = dragOffset.y + dy;
                    }

                    renderCanvas();
                } else if (isPanning) {
                    // 平移畫布
                    offsetX += e.clientX - panStart.x;
                    offsetY += e.clientY - panStart.y;
                    panStart = { x: e.clientX, y: e.clientY };
                    renderCanvas();
                }
            });

            window.addEventListener('mouseup', (e) => {
                // 檢查多選模式下是否為點擊（未發生拖曳）
                if (isMultiSelectMode && multiSelectClickStart) {
                    // 未發生拖曳，切換選擇狀態
                    toggleElementMultiSelection(multiSelectClickStart.elementId, multiSelectClickStart.elementType);
                    multiSelectClickStart = null;
                    dragTarget = null;
                    return;
                }

                if (isBoxSelecting) {
                    // 結束框選，選擇所有在矩形內的元素
                    const container = document.getElementById('canvas-container');
                    const rect = container.getBoundingClientRect();
                    const currentX = (e.clientX - rect.left - offsetX) / scale;
                    const currentY = (e.clientY - rect.top - offsetY) / scale;

                    const left = Math.min(boxSelectStart.x, currentX);
                    const top = Math.min(boxSelectStart.y, currentY);
                    const width = Math.abs(currentX - boxSelectStart.x);
                    const height = Math.abs(currentY - boxSelectStart.y);

                    // 選擇所有在矩形內的元素
                    if (currentMapData) {
                        // 檢查節點
                        currentMapData.data.nodes.forEach(node => {
                            if (isElementInRect(node, left, top, width, height)) {
                                if (!isElementMultiSelected(node.id, 'node')) {
                                    multiSelectedElements.push({ id: node.id, type: 'node' });
                                }
                            }
                        });

                        // 檢查框架
                        currentMapData.data.frames.forEach(frame => {
                            if (isElementInRect(frame, left, top, width, height)) {
                                if (!isElementMultiSelected(frame.id, 'frame')) {
                                    multiSelectedElements.push({ id: frame.id, type: 'frame' });
                                }
                            }
                        });

                        // 檢查連接線
                        if (currentMapData.data.connections) {
                            currentMapData.data.connections.forEach(conn => {
                                // 獲取起點和終點元素
                                const fromNode = currentMapData.data.nodes.find(n => n.id === conn.from);
                                const fromFrame = currentMapData.data.frames.find(f => f.id === conn.from);
                                const toNode = currentMapData.data.nodes.find(n => n.id === conn.to);
                                const toFrame = currentMapData.data.frames.find(f => f.id === conn.to);

                                const fromEl = fromNode || fromFrame;
                                const toEl = toNode || toFrame;

                                if (fromEl && toEl) {
                                    // 計算兩個元素的中心點
                                    const cx1 = fromEl.x + fromEl.width / 2;
                                    const cy1 = fromEl.y + fromEl.height / 2;
                                    const cx2 = toEl.x + toEl.width / 2;
                                    const cy2 = toEl.y + toEl.height / 2;

                                    // 創建虛擬的連接線邊界框
                                    // 使用兩個中心點構成的矩形作為連接線的範圍
                                    const connRect = {
                                        x: Math.min(cx1, cx2),
                                        y: Math.min(cy1, cy2),
                                        width: Math.abs(cx1 - cx2),
                                        height: Math.abs(cy1 - cy2)
                                    };

                                    // 如果寬度或高度為0，給予一個微小值以利於檢測
                                    if (connRect.width < 1) connRect.width = 1;
                                    if (connRect.height < 1) connRect.height = 1;

                                    // 檢查是否與框選範圍相交
                                    // 使用精確的線段檢測（基於元素邊緣交點）
                                    const fromRect = { x: fromEl.x, y: fromEl.y, width: fromEl.width, height: fromEl.height };
                                    const toRect = { x: toEl.x, y: toEl.y, width: toEl.width, height: toEl.height };

                                    const p1 = getEdgePoint(fromRect, cx2, cy2, cx1, cy1);
                                    const p2 = getEdgePoint(toRect, cx1, cy1, cx2, cy2);

                                    const isIntersect = isLineInRect(p1.x, p1.y, p2.x, p2.y, left, top, width, height);

                                    if (isIntersect) {
                                        if (!isElementMultiSelected(conn.id, 'connection')) {
                                            multiSelectedElements.push({ id: conn.id, type: 'connection' });

                                            // 自動選取兩端元素
                                            if (fromNode && !isElementMultiSelected(fromNode.id, 'node')) {
                                                multiSelectedElements.push({ id: fromNode.id, type: 'node' });
                                            } else if (fromFrame && !isElementMultiSelected(fromFrame.id, 'frame')) {
                                                multiSelectedElements.push({ id: fromFrame.id, type: 'frame' });
                                            }

                                            if (toNode && !isElementMultiSelected(toNode.id, 'node')) {
                                                multiSelectedElements.push({ id: toNode.id, type: 'node' });
                                            } else if (toFrame && !isElementMultiSelected(toFrame.id, 'frame')) {
                                                multiSelectedElements.push({ id: toFrame.id, type: 'frame' });
                                            }
                                        }
                                    }
                                }
                            });
                        }
                    }

                    // 隱藏選擇框
                    if (selectionBox) {
                        selectionBox.style.display = 'none';
                    }
                    isBoxSelecting = false;

                    // 更新UI
                    updatePropertyEditor();
                    updateCopyPasteButtons();
                    renderCanvas();
                    return;
                }

                if (isResizing) {
                    isResizing = false;
                    resizeTarget = null;
                    saveHistory();
                    markMapAsModified();
                }

                if (isDragging) {
                    isDragging = false;
                    dragTarget = null;
                    saveHistory();
                    markMapAsModified();
                }

                isPanning = false;
                container.classList.remove('grabbing');
            });

            // 觸控調整大小（window 層級）- 拖曳邏輯已移到節點/Frame 的 touchstart 中
            window.addEventListener('touchmove', (e) => {
                // 注意：節點和 Frame 的拖曳由各自的 touchstart 處理器管理
                // 這裡只處理調整大小
                if (isResizing && resizeTarget && resizeStartInfo && e.touches.length === 1) {
                    e.preventDefault();
                    const touch = e.touches[0];

                    const currentX = (touch.clientX - offsetX) / scale;
                    const currentY = (touch.clientY - offsetY) / scale;

                    const deltaX = currentX - resizeStartInfo.startX;
                    const deltaY = currentY - resizeStartInfo.startY;

                    // 根據元素類型設置最小尺寸
                    const minWidth = resizeTarget.type === 'frame' ? 150 : 50;
                    const minHeight = resizeTarget.type === 'frame' ? 150 : 30;

                    const newWidth = Math.max(minWidth, resizeStartInfo.startWidth + deltaX);
                    const newHeight = Math.max(minHeight, resizeStartInfo.startHeight + deltaY);

                    resizeTarget.element.width = newWidth;
                    resizeTarget.element.height = newHeight;

                    renderCanvas();
                    updatePropertyEditor();
                }
            }, { passive: false });

            // 觸控拖曳結束
            window.addEventListener('touchend', () => {
                const debugInfo = document.getElementById('debug-info');

                if (isResizing) {
                    isResizing = false;
                    resizeTarget = null;
                    renderCanvas(); // 確保最終狀態正確
                    saveHistory();
                    markMapAsModified();

                    // 隱藏調試面板
                    const debugPanel = document.getElementById('resize-debug');
                    if (debugPanel) {
                        setTimeout(() => {
                            debugPanel.classList.remove('show');
                        }, 1000);
                    }
                }

                if (isDragging) {
                    if (debugInfo) {
                        debugInfo.innerHTML = `
                            <div>✅ touchend</div>
                            <div>拖曳結束，已保存</div>
                            <div>touchmove 次數: ${touchMoveCount}</div>
                        `;
                    }

                    isDragging = false;
                    dragTarget = null;
                    touchMoveCount = 0;
                    renderCanvas(); // 確保最終狀態正確
                    saveHistory();
                    markMapAsModified();

                    // 3秒後清除調試資訊
                    setTimeout(() => {
                        if (debugInfo) {
                            debugInfo.innerHTML = '等待觸控...';
                        }
                    }, 3000);
                }
            });

            // 縮放事件
            container.addEventListener('wheel', (e) => {
                e.preventDefault();
                const delta = e.deltaY > 0 ? 0.9 : 1.1;
                const rect = container.getBoundingClientRect();
                const mouseX = e.clientX - rect.left;
                const mouseY = e.clientY - rect.top;

                offsetX = mouseX - (mouseX - offsetX) * delta;
                offsetY = mouseY - (mouseY - offsetY) * delta;
                scale *= delta;
                scale = Math.max(0.05, Math.min(5, scale));  // 允許縮小到 0.05，方便在手機上看清全局
                renderCanvas();
                showScaleIndicator();
            });

            // ==================== 觸控事件支援 ====================
            let touchStartDistance = 0;
            let touchStartScale = 1;
            let lastTouchX = 0;
            let lastTouchY = 0;

            // 觸控開始
            container.addEventListener('touchstart', (e) => {
                if (e.touches.length === 1) {
                    // 單指觸控：準備平移或點擊元素
                    const touch = e.touches[0];
                    if (e.target === container || e.target === frameLayer || e.target === nodeLayer) {
                        // 如果在多選模式下，開始框選
                        if (isMultiSelectMode) {
                            isBoxSelecting = true;
                            const rect = container.getBoundingClientRect();
                            boxSelectStart = {
                                x: (touch.clientX - rect.left - offsetX) / scale,
                                y: (touch.clientY - rect.top - offsetY) / scale
                            };

                            // 創建選擇框元素
                            if (!selectionBox) {
                                selectionBox = document.createElement('div');
                                selectionBox.style.position = 'absolute';
                                selectionBox.style.border = '2px dashed var(--purple-color)';
                                selectionBox.style.background = 'rgba(155, 89, 182, 0.1)';
                                selectionBox.style.pointerEvents = 'none';
                                selectionBox.style.zIndex = '9999';
                                container.appendChild(selectionBox);
                            }
                            selectionBox.style.display = 'block';
                            return;
                        }

                        // 取消選擇元素
                        selectedElement = null;
                        updatePropertyEditor();
                        updateCopyPasteButtons();

                        isPanning = true;
                        lastTouchX = touch.clientX;
                        lastTouchY = touch.clientY;
                        panStart = { x: touch.clientX, y: touch.clientY };
                        container.classList.add('grabbing');
                        renderCanvas();
                    }
                } else if (e.touches.length === 2) {
                    // 雙指觸控：準備縮放
                    e.preventDefault();
                    isPanning = false;  // 停止平移
                    const touch1 = e.touches[0];
                    const touch2 = e.touches[1];
                    touchStartDistance = Math.hypot(
                        touch2.clientX - touch1.clientX,
                        touch2.clientY - touch1.clientY
                    );
                    touchStartScale = scale;

                    // 計算雙指中心點
                    const centerX = (touch1.clientX + touch2.clientX) / 2;
                    const centerY = (touch1.clientY + touch2.clientY) / 2;
                    lastTouchX = centerX;
                    lastTouchY = centerY;
                }
            }, { passive: false });

            // 觸控移動
            container.addEventListener('touchmove', (e) => {
                // 如果正在框選
                if (isBoxSelecting && selectionBox && e.touches.length === 1) {
                    e.preventDefault();
                    const touch = e.touches[0];
                    const rect = container.getBoundingClientRect();
                    const currentX = (touch.clientX - rect.left - offsetX) / scale;
                    const currentY = (touch.clientY - rect.top - offsetY) / scale;

                    const left = Math.min(boxSelectStart.x, currentX);
                    const top = Math.min(boxSelectStart.y, currentY);
                    const width = Math.abs(currentX - boxSelectStart.x);
                    const height = Math.abs(currentY - boxSelectStart.y);

                    // 應用變換
                    selectionBox.style.left = (left * scale + offsetX) + 'px';
                    selectionBox.style.top = (top * scale + offsetY) + 'px';
                    selectionBox.style.width = (width * scale) + 'px';
                    selectionBox.style.height = (height * scale) + 'px';
                    return;
                }

                // 如果正在拖曳節點/框架，阻止默認行為（讓 window touchmove 處理）
                if (isDragging) {
                    e.preventDefault();
                    return;
                }

                // 如果正在縮放元素，不要阻止事件，讓它冒泡到 window 的 touchmove 處理
                if (isResizing) {
                    return;  // 不調用 preventDefault，讓 window touchmove 處理
                }

                if (e.touches.length === 1 && isPanning) {
                    // 單指平移畫布
                    e.preventDefault();
                    const touch = e.touches[0];
                    offsetX += touch.clientX - lastTouchX;
                    offsetY += touch.clientY - lastTouchY;
                    lastTouchX = touch.clientX;
                    lastTouchY = touch.clientY;
                    renderCanvas();
                } else if (e.touches.length === 2) {
                    // 雙指縮放
                    e.preventDefault();
                    const touch1 = e.touches[0];
                    const touch2 = e.touches[1];
                    const currentDistance = Math.hypot(
                        touch2.clientX - touch1.clientX,
                        touch2.clientY - touch1.clientY
                    );

                    // 計算雙指中心點
                    const centerX = (touch1.clientX + touch2.clientX) / 2;
                    const centerY = (touch1.clientY + touch2.clientY) / 2;
                    const rect = container.getBoundingClientRect();
                    const touchX = centerX - rect.left;
                    const touchY = centerY - rect.top;

                    // 計算縮放比例
                    const scaleChange = currentDistance / touchStartDistance;
                    const newScale = touchStartScale * scaleChange;

                    // 以雙指中心點為基準縮放
                    offsetX = touchX - (touchX - offsetX) * (newScale / scale);
                    offsetY = touchY - (touchY - offsetY) * (newScale / scale);

                    scale = Math.max(0.05, Math.min(5, newScale));
                    renderCanvas();
                    showScaleIndicator();
                }
            }, { passive: false });

            // 觸控結束
            container.addEventListener('touchend', (e) => {
                if (isBoxSelecting && e.touches.length === 0) {
                    // 結束框選，選擇所有在矩形內的元素
                    const touch = e.changedTouches[0];
                    const rect = container.getBoundingClientRect();
                    const currentX = (touch.clientX - rect.left - offsetX) / scale;
                    const currentY = (touch.clientY - rect.top - offsetY) / scale;

                    const left = Math.min(boxSelectStart.x, currentX);
                    const top = Math.min(boxSelectStart.y, currentY);
                    const width = Math.abs(currentX - boxSelectStart.x);
                    const height = Math.abs(currentY - boxSelectStart.y);

                    // 選擇所有在矩形內的元素
                    if (currentMapData) {
                        // 檢查節點
                        currentMapData.data.nodes.forEach(node => {
                            if (isElementInRect(node, left, top, width, height)) {
                                if (!isElementMultiSelected(node.id, 'node')) {
                                    multiSelectedElements.push({ id: node.id, type: 'node' });
                                }
                            }
                        });

                        // 檢查框架
                        currentMapData.data.frames.forEach(frame => {
                            if (isElementInRect(frame, left, top, width, height)) {
                                if (!isElementMultiSelected(frame.id, 'frame')) {
                                    multiSelectedElements.push({ id: frame.id, type: 'frame' });
                                }
                            }
                        });

                        // 檢查連接線
                        if (currentMapData.data.connections) {
                            currentMapData.data.connections.forEach(conn => {
                                // 獲取起點和終點元素
                                const fromNode = currentMapData.data.nodes.find(n => n.id === conn.from);
                                const fromFrame = currentMapData.data.frames.find(f => f.id === conn.from);
                                const toNode = currentMapData.data.nodes.find(n => n.id === conn.to);
                                const toFrame = currentMapData.data.frames.find(f => f.id === conn.to);

                                const fromEl = fromNode || fromFrame;
                                const toEl = toNode || toFrame;

                                if (fromEl && toEl) {
                                    // 計算兩個元素的中心點
                                    const cx1 = fromEl.x + fromEl.width / 2;
                                    const cy1 = fromEl.y + fromEl.height / 2;
                                    const cx2 = toEl.x + toEl.width / 2;
                                    const cy2 = toEl.y + toEl.height / 2;

                                    // 使用精確的線段與矩形相交檢測（基於元素邊緣交點）
                                    const fromRect = { x: fromEl.x, y: fromEl.y, width: fromEl.width, height: fromEl.height };
                                    const toRect = { x: toEl.x, y: toEl.y, width: toEl.width, height: toEl.height };

                                    const p1 = getEdgePoint(fromRect, cx2, cy2, cx1, cy1);
                                    const p2 = getEdgePoint(toRect, cx1, cy1, cx2, cy2);

                                    if (isLineInRect(p1.x, p1.y, p2.x, p2.y, left, top, width, height)) {
                                        if (!isElementMultiSelected(conn.id, 'connection')) {
                                            multiSelectedElements.push({ id: conn.id, type: 'connection' });

                                            // 自動選取兩端元素
                                            if (fromNode && !isElementMultiSelected(fromNode.id, 'node')) {
                                                multiSelectedElements.push({ id: fromNode.id, type: 'node' });
                                            } else if (fromFrame && !isElementMultiSelected(fromFrame.id, 'frame')) {
                                                multiSelectedElements.push({ id: fromFrame.id, type: 'frame' });
                                            }

                                            if (toNode && !isElementMultiSelected(toNode.id, 'node')) {
                                                multiSelectedElements.push({ id: toNode.id, type: 'node' });
                                            } else if (toFrame && !isElementMultiSelected(toFrame.id, 'frame')) {
                                                multiSelectedElements.push({ id: toFrame.id, type: 'frame' });
                                            }
                                        }
                                    }
                                }
                            });
                        }
                    }

                    // 隱藏選擇框
                    if (selectionBox) {
                        selectionBox.style.display = 'none';
                    }
                    isBoxSelecting = false;

                    // 更新UI
                    updatePropertyEditor();
                    updateCopyPasteButtons();
                    renderCanvas();
                    return;
                }

                if (e.touches.length === 0) {
                    isPanning = false;
                    container.classList.remove('grabbing');
                }
            }, { passive: false });

            // 初始化 SVG 尺寸
            updateSVGSize();
            window.addEventListener('resize', updateSVGSize);
        }

        function updateSVGSize() {
            const container = document.getElementById('canvas-container');
            const svg = document.getElementById('svg-layer');
            const rect = container.getBoundingClientRect();
            svg.setAttribute('width', rect.width);
            svg.setAttribute('height', rect.height);
        }

        // 顯示縮放比例指示器
        let scaleIndicatorTimer = null;
        function showScaleIndicator() {
            const indicator = document.getElementById('scale-indicator');
            if (!indicator) return;

            // 更新顯示的百分比
            indicator.textContent = Math.round(scale * 100) + '%';

            // 顯示指示器
            indicator.classList.add('show');

            // 清除之前的計時器
            if (scaleIndicatorTimer) {
                clearTimeout(scaleIndicatorTimer);
            }

            // 1.5 秒後自動隱藏
            scaleIndicatorTimer = setTimeout(() => {
                indicator.classList.remove('show');
            }, 1500);
        }

        function centerCanvasContent() {
            if (!currentMapData || !currentMapData.data.nodes || !currentMapData.data.frames) return;

            const nodes = currentMapData.data.nodes;
            const frames = currentMapData.data.frames;

            if (nodes.length === 0 && frames.length === 0) {
                offsetX = 0;
                offsetY = 0;
                scale = 1;
                if (typeof showScaleIndicator === 'function') showScaleIndicator();
                return;
            }

            let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;

            const allElements = [...nodes, ...frames];
            allElements.forEach(el => {
                minX = Math.min(minX, el.x);
                minY = Math.min(minY, el.y);
                maxX = Math.max(maxX, el.x + el.width);
                maxY = Math.max(maxY, el.y + el.height);
            });

            const contentWidth = maxX - minX;
            const contentHeight = maxY - minY;
            const contentCenterX = minX + contentWidth / 2;
            const contentCenterY = minY + contentHeight / 2;

            const container = document.getElementById('canvas-container');
            const containerWidth = container.clientWidth;
            const containerHeight = container.clientHeight;

            // 重置縮放
            scale = 1;

            // 計算置中偏移
            offsetX = (containerWidth / 2) - contentCenterX * scale;
            offsetY = (containerHeight / 2) - contentCenterY * scale;

            // 更新縮放指示器
            if (typeof showScaleIndicator === 'function') {
                showScaleIndicator();
            }
        }

        function renderCanvas() {
            const frameLayer = document.getElementById('frame-layer');
            const nodeLayer = document.getElementById('node-layer');
            const svg = document.getElementById('svg-layer');

            frameLayer.innerHTML = '';
            nodeLayer.innerHTML = '';
            svg.innerHTML = '';

            if (!currentMapData) return;

            // 應用變換到各層
            const transform = `translate(${offsetX}px, ${offsetY}px) scale(${scale})`;
            frameLayer.style.transform = transform;
            nodeLayer.style.transform = transform;

            // 渲染框架到框架層
            currentMapData.data.frames.forEach(frame => renderFrame(frame));

            // 渲染節點到節點層
            currentMapData.data.nodes.forEach(node => renderNode(node));

            // 渲染連接線
            renderConnections();
        }

        function renderNode(node) {
            const nodeLayer = document.getElementById('node-layer');
            const nodeEl = document.createElement('div');
            nodeEl.className = 'node';
            nodeEl.dataset.id = node.id;
            nodeEl.dataset.type = 'node';
            nodeEl.style.left = node.x + 'px';
            nodeEl.style.top = node.y + 'px';
            nodeEl.style.width = node.width + 'px';
            nodeEl.style.height = node.height + 'px';
            nodeEl.style.overflow = 'hidden';
            nodeEl.style.background = node.color || '#3498db';
            nodeEl.style.textAlign = node.textAlign || 'center';

            // 根據文字對齊設置 flexbox 的 align-items（因為 flex-direction: column）
            const textAlign = node.textAlign || 'center';
            if (textAlign === 'left') {
                nodeEl.style.alignItems = 'flex-start';
            } else if (textAlign === 'right') {
                nodeEl.style.alignItems = 'flex-end';
            } else {
                nodeEl.style.alignItems = 'center';
            }

            nodeEl.innerHTML = node.text || '';

            // 添加狀態徽章
            if (node.completed || node.abandoned) {
                const badge = document.createElement('div');
                badge.className = 'status-badge';

                if (node.completed && node.abandoned) {
                    // 兩者都有，使用特殊樣式
                    badge.style.background = 'linear-gradient(135deg, var(--success-color) 50%, var(--accent-color) 50%)';
                    badge.style.color = 'white';
                    badge.textContent = '✓✗';
                } else if (node.completed) {
                    badge.classList.add('status-completed');
                    badge.textContent = '✓';
                } else if (node.abandoned) {
                    badge.classList.add('status-abandoned');
                    badge.textContent = '✗';
                }

                nodeEl.appendChild(badge);
            }

            // 拖曳節點或連接模式處理（滑鼠）
            nodeEl.addEventListener('mousedown', (e) => {
                e.stopPropagation();

                // 如果處於連接模式
                if (isConnecting) {
                    handleConnectionClick(node.id, 'node');
                    return;
                }

                // 如果處於多選模式
                if (isMultiSelectMode) {
                    // 記錄點擊位置，稍後判斷是點擊還是拖曳
                    multiSelectClickStart = {
                        x: e.clientX,
                        y: e.clientY,
                        elementId: node.id,
                        elementType: 'node',
                        isSelected: isElementMultiSelected(node.id, 'node')
                    };
                    dragStart = { x: e.clientX, y: e.clientY };

                    // 如果點擊的是已選中的元素，準備拖曳（但還不開始）
                    if (multiSelectClickStart.isSelected) {
                        dragTarget = { type: 'multi-select', elements: multiSelectedElements };
                        // 記錄所有選中元素的初始位置
                        dragOffsets = {};
                        multiSelectedElements.forEach(el => {
                            if (el.type === 'node') {
                                const n = currentMapData.data.nodes.find(node => node.id === el.id);
                                if (n) dragOffsets[el.id] = { x: n.x, y: n.y };
                            } else if (el.type === 'frame') {
                                const f = currentMapData.data.frames.find(frame => frame.id === el.id);
                                if (f) dragOffsets[el.id] = { x: f.x, y: f.y };
                            }
                        });
                    }
                    return;
                }

                // 選擇元素
                selectElement(node.id, 'node');

                // 開始拖曳
                isDragging = true;
                dragTarget = { type: 'node', element: node };
                dragStart = { x: e.clientX, y: e.clientY };
                dragOffset = { x: node.x, y: node.y };
            });

            // 觸控支援
            nodeEl.addEventListener('touchstart', (e) => {
                // 如果觸碰的是 resize handle，不處理（讓 resize handle 自己處理）
                if (e.target.classList.contains('resize-handle')) {
                    return;
                }

                e.preventDefault();
                e.stopPropagation();

                // 如果處於連接模式
                if (isConnecting) {
                    handleConnectionClick(node.id, 'node');
                    return;
                }

                // 如果處於多選模式
                if (isMultiSelectMode) {
                    const touch = e.touches[0];
                    const containerEl = document.getElementById('canvas-container');
                    const rect = containerEl.getBoundingClientRect();
                    const containerX = touch.clientX - rect.left;
                    const containerY = touch.clientY - rect.top;
                    const canvasX = (containerX - offsetX) / scale;
                    const canvasY = (containerY - offsetY) / scale;

                    // 記錄點擊位置，稍後判斷是點擊還是拖曳
                    multiSelectClickStart = {
                        x: touch.clientX,
                        y: touch.clientY,
                        elementId: node.id,
                        elementType: 'node',
                        isSelected: isElementMultiSelected(node.id, 'node')
                    };

                    // 如果點擊的是已選中的元素，準備拖曳（但還不開始）
                    if (multiSelectClickStart.isSelected) {
                        isPanning = false;
                        dragTarget = {
                            type: 'multi-select',
                            elements: multiSelectedElements,
                            startX: canvasX,
                            startY: canvasY
                        };

                        // 記錄所有選中元素的初始位置
                        dragOffsets = {};
                        multiSelectedElements.forEach(el => {
                            if (el.type === 'node') {
                                const n = currentMapData.data.nodes.find(node => node.id === el.id);
                                if (n) dragOffsets[el.id] = { x: n.x, y: n.y };
                            } else if (el.type === 'frame') {
                                const f = currentMapData.data.frames.find(frame => frame.id === el.id);
                                if (f) dragOffsets[el.id] = { x: f.x, y: f.y };
                            }
                        });
                    }
                    return;
                }

                // 選擇元素
                selectElement(node.id, 'node');

                // 停止畫布平移，開始拖曳節點
                isPanning = false;
                isDragging = true;

                // 記錄初始觸碰位置和節點位置
                const touch = e.touches[0];
                const containerEl = document.getElementById('canvas-container');
                const rect = containerEl.getBoundingClientRect();
                const containerX = touch.clientX - rect.left;
                const containerY = touch.clientY - rect.top;
                const canvasX = (containerX - offsetX) / scale;
                const canvasY = (containerY - offsetY) / scale;

                dragTarget = {
                    type: 'node',
                    element: node,
                    startX: canvasX,
                    startY: canvasY,
                    initialNodeX: node.x,
                    initialNodeY: node.y
                };
            }, { passive: false });

            // 觸控拖曳
            nodeEl.addEventListener('touchmove', (e) => {
                // 檢查多選模式下是否應該開始拖曳
                if (isMultiSelectMode && multiSelectClickStart && !isDragging && dragTarget) {
                    const touch = e.touches[0];
                    const dx = Math.abs(touch.clientX - multiSelectClickStart.x);
                    const dy = Math.abs(touch.clientY - multiSelectClickStart.y);

        function renderConnections() {
            if (!currentMapData || !currentMapData.data.connections) return;

            const svg = document.getElementById('svg-layer');
            // 清空舊的連接線，避免殘影
            svg.innerHTML = '';

            currentMapData.data.connections.forEach(connection => {
                // 查找起點和終點元素
                const fromNode = currentMapData.data.nodes.find(n => n.id === connection.from);
                const fromFrame = currentMapData.data.frames.find(f => f.id === connection.from);
                const toNode = currentMapData.data.nodes.find(n => n.id === connection.to);
                const toFrame = currentMapData.data.frames.find(f => f.id === connection.to);

                const from = fromNode || fromFrame;
                const to = toNode || toFrame;

                if (!from || !to) return; // 如果找不到元素，跳過

                // 計算兩個節點的中心點
                // 計算兩個節點的中心點
                // 計算兩個節點的中心點
                // 改用 DOM 元素的實際尺寸來計算，以解決 CSS 內容撐開但數據已縮小的不同步問題
                const fromEl = document.querySelector(`[data-id="${from.id}"]`);
                const toEl = document.querySelector(`[data-id="${to.id}"]`);

                const fromWidth = fromEl ? fromEl.offsetWidth : from.width;
                const fromHeight = fromEl ? fromEl.offsetHeight : from.height;
                const toWidth = toEl ? toEl.offsetWidth : to.width;
                const toHeight = toEl ? toEl.offsetHeight : to.height;

                // 但是尺寸(offsetWidth)是經過 layout 的，可以反映內容撐開的情況

                const fromCenterX = from.x + fromWidth / 2;
                const fromCenterY = from.y + fromHeight / 2;

                const toCenterX = to.x + toWidth / 2;
                const toCenterY = to.y + toHeight / 2;

                // 計算邊緣交點
                // 傳入的 rect 也需要更新為實際尺寸的 rect
                const fromRect = { x: from.x, y: from.y, width: fromWidth, height: fromHeight };
                const toRect = { x: to.x, y: to.y, width: toWidth, height: toHeight };

                const fromEdge = getEdgePoint(fromRect, toCenterX, toCenterY, fromCenterX, fromCenterY);
                const toEdge = getEdgePoint(toRect, fromCenterX, fromCenterY, toCenterX, toCenterY);



                // 將座標轉換為屏幕座標（考慮 scale 和 offset）
                const x1 = fromEdge.x * scale + offsetX;
                const y1 = fromEdge.y * scale + offsetY;
                const x2 = toEdge.x * scale + offsetX;
                const y2 = toEdge.y * scale + offsetY;

                hitArea.setAttribute('y2', y2);
                hitArea.setAttribute('stroke', 'transparent');

                hitArea.style.cursor = 'pointer';
                hitArea.style.pointerEvents = 'auto'; // 允許點擊區域接收事件

                    e.stopPropagation();

                    if (isMultiSelectMode) {
                        toggleConnectionMultiSelection(connection.id, connection.from, connection.to);
                        return;

                    selectElement(connection.id, 'connection');
                });

                // 創建實際的線條
                const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                line.setAttribute('x1', x1);
                line.setAttribute('y1', y1);
                line.setAttribute('x2', x2);

                // 根據 arrowType 添加箭頭或虛線樣式
                if (connection.arrowType === 'single') {

                    // 虛線無箭頭（註解用）
                    line.setAttribute('stroke-dasharray', `${6 * scale},${4 * scale}`);
                }
                // arrowType === 'none' 時不添加任何箭頭

                line.style.pointerEvents = 'none'; // 線條本身不接收點擊

                // 如果是當前選中的連接，添加高亮效果
                if (selectedElement && selectedElement.id === connection.id && selectedElement.type === 'connection') {

                    line.setAttribute('stroke', '#e74c3c');

                    line.setAttribute('stroke', 'var(--purple-color)');
                }

                svg.appendChild(hitArea);
                svg.appendChild(line);

                // 如果有標籤，添加文字
                if (connection.label) {
                    const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');

                    text.setAttribute('y', midY - 5 * scale);
                    text.setAttribute('text-anchor', 'middle');
                    text.setAttribute('fill', connection.color || '#7f8c8d');
                    text.setAttribute('font-size', 14 * scale);
                    text.setAttribute('font-weight', 'bold');
                    text.style.pointerEvents = 'none';
                    text.textContent = connection.label;

                    // 添加白色背景以提高可讀性
                    const textBg = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
                    const bbox = { width: connection.label.length * 8 * scale, height: 18 * scale };
                    textBg.setAttribute('x', midX - bbox.width / 2 - 2 * scale);
                    textBg.setAttribute('y', midY - 5 * scale - 14 * scale);
                    textBg.setAttribute('width', bbox.width + 4 * scale);
                    textBg.setAttribute('height', bbox.height);
                    textBg.setAttribute('fill', 'white');
                    textBg.setAttribute('opacity', '0.8');
                    textBg.style.pointerEvents = 'none';

                    svg.appendChild(textBg);
                    svg.appendChild(text);
                }
            });

            // 確保箭頭標記存在
            ensureArrowMarker();
        }

        function ensureArrowMarker() {
            const svg = document.getElementById('svg-layer');

            // 每次都重新創建箭頭標記以適應不同的 scale
            // 先移除舊的
            const oldDefs = svg.querySelector('defs');
            if (oldDefs) {
                oldDefs.remove();
            }

            // 創建新的箭頭標記
            const defs = document.createElementNS('http://www.w3.org/2000/svg', 'defs');

            // 正向箭頭（末端）
            const marker = document.createElementNS('http://www.w3.org/2000/svg', 'marker');
            marker.setAttribute('id', 'arrowhead');
            marker.setAttribute('markerWidth', 10 * scale);
            marker.setAttribute('markerHeight', 10 * scale);
            marker.setAttribute('refX', 10 * scale);  // 箭頭尖端位置，防止深入節點
            marker.setAttribute('refY', 5 * scale);   // 箭頭寬度的一半，保持居中
            marker.setAttribute('orient', 'auto');
            marker.setAttribute('markerUnits', 'userSpaceOnUse');

            const polygon = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
            const points = `0 0, ${10 * scale} ${5 * scale}, 0 ${10 * scale}`;  // 增加寬度讓箭頭更明顯
            polygon.setAttribute('points', points);
            polygon.setAttribute('fill', 'context-stroke');

            marker.appendChild(polygon);
            defs.appendChild(marker);

            // 反向箭頭（起點）
            const markerReverse = document.createElementNS('http://www.w3.org/2000/svg', 'marker');
            markerReverse.setAttribute('id', 'arrowhead-reverse');
            markerReverse.setAttribute('markerWidth', 10 * scale);
            markerReverse.setAttribute('markerHeight', 10 * scale);
            markerReverse.setAttribute('refX', 0);  // 箭頭尖端位置，防止深入節點
            markerReverse.setAttribute('refY', 5 * scale);  // 箭頭寬度的一半，保持居中
            markerReverse.setAttribute('orient', 'auto');
            markerReverse.setAttribute('markerUnits', 'userSpaceOnUse');

            const polygonReverse = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
            const pointsReverse = `${10 * scale} 0, 0 ${5 * scale}, ${10 * scale} ${10 * scale}`;  // 增加寬度讓箭頭更明顯
            polygonReverse.setAttribute('points', pointsReverse);
            polygonReverse.setAttribute('fill', 'context-stroke');

            markerReverse.appendChild(polygonReverse);
            defs.appendChild(markerReverse);

            svg.insertBefore(defs, svg.firstChild);
        }

        // 計算從固定參考點到目標點的射線與矩形邊緣的交點
        // refX, refY: 固定參考點（不隨矩形大小改變）
        // targetX, targetY: 目標點（確定射線方向）
        function getEdgePoint(rect, targetX, targetY, refX = null, refY = null) {
            const left = rect.x;
            const width = Math.max(50, rect.width || 0);
            const height = Math.max(30, rect.height || 0);
            const right = rect.x + width;
            const top = rect.y;
            const bottom = rect.y + height;

            // 如果沒有提供參考點，使用矩形中心（兼容舊代碼）
            const centerX = refX !== null ? refX : (left + right) / 2;
            const centerY = refY !== null ? refY : (top + bottom) / 2;

            // 計算方向向量（從參考點指向目標點）
            const dx = targetX - centerX;
            const dy = targetY - centerY;

            // 如果目標就是參考點，返回矩形中心
            if (Math.abs(dx) < 0.001 && Math.abs(dy) < 0.001) {
                return { x: (left + right) / 2, y: (top + bottom) / 2 };
            }

            // 計算射線與矩形四條邊的交點
            // 射線方程：P = (centerX, centerY) + t * (dx, dy)
            // 對於任意參考點，計算到各邊的距離

            // 計算參數 t（射線與各邊相交的距離）
            // 注意：這裡不再假設參考點在中心，而是使用實際距離
            const txLeft = dx !== 0 ? (left - centerX) / dx : Infinity;
            const txRight = dx !== 0 ? (right - centerX) / dx : Infinity;
            const tyTop = dy !== 0 ? (top - centerY) / dy : Infinity;
            const tyBottom = dy !== 0 ? (bottom - centerY) / dy : Infinity;

            // 找出最小的正 t 值，確定會先碰到哪條邊
            const candidates = [];
            if (txLeft > 0.0001) candidates.push({ t: txLeft, edge: 'left', x: left });
            if (txRight > 0.0001) candidates.push({ t: txRight, edge: 'right', x: right });
            if (tyTop > 0.0001) candidates.push({ t: tyTop, edge: 'top', y: top });
            if (tyBottom > 0.0001) candidates.push({ t: tyBottom, edge: 'bottom', y: bottom });

            if (candidates.length === 0) {
                return { x: centerX, y: centerY };
            }

            // 選擇最小 t 值對應的邊
            candidates.sort((a, b) => a.t - b.t);
            const chosen = candidates[0];

            // 根據碰到的邊，使用精確的邊界座標
            let edgeX, edgeY;

            if (chosen.edge === 'left' || chosen.edge === 'right') {
                // 碰到左邊或右邊：x 座標使用邊界的精確值，y 座標通過計算得出
                edgeX = chosen.x;
                edgeY = centerY + chosen.t * dy;
                // 確保 y 在範圍內
                edgeY = Math.max(top, Math.min(bottom, edgeY));
            } else {
                // 碰到頂邊或底邊：y 座標使用邊界的精確值，x 座標通過計算得出
                edgeY = chosen.y;
                edgeX = centerX + chosen.t * dx;
                // 確保 x 在範圍內
                edgeX = Math.max(left, Math.min(right, edgeX));
            }

            return { x: edgeX, y: edgeY };
        }

        // 計算從點 (x1, y1) 到點 (x2, y2) 的直線與矩形邊緣的交點
        function getEdgePointFromLine(rect, x1, y1, x2, y2) {
            const centerX = rect.x + rect.width / 2;
            const centerY = rect.y + rect.height / 2;

            // 計算方向向量
            const dx = x2 - x1;
            const dy = y2 - y1;

            // 如果沒有方向，返回中心點
            if (Math.abs(dx) < 0.001 && Math.abs(dy) < 0.001) {
                return { x: centerX, y: centerY };
            }

            // 矩形的四條邊
            const left = rect.x;
            const right = rect.x + rect.width;
            const top = rect.y;
            const bottom = rect.y + rect.height;

            // 極小值用於浮點數比較
            const eps = 0.01;

            // 計算與每條邊的交點參數 t
            const candidates = [];

            // 左邊: x = left
            if (Math.abs(dx) > eps) {
                const t = (left - x1) / dx;
                if (t > eps && t < 1.0) {  // 只接受 0 < t < 1 的交點
                    const y = y1 + t * dy;
                    // 嚴格檢查：y 必須在 top 和 bottom 之間
                    if (y >= top && y <= bottom) {
                        candidates.push({ t, x: left, y, edge: 'left' });
                    }
                }
            }

            // 右邊: x = right
            if (Math.abs(dx) > eps) {
                const t = (right - x1) / dx;
                if (t > eps && t < 1.0) {
                    const y = y1 + t * dy;
                    if (y >= top && y <= bottom) {
                        candidates.push({ t, x: right, y, edge: 'right' });
                    }
                }
            }

            // 上邊: y = top
            if (Math.abs(dy) > eps) {
                const t = (top - y1) / dy;
                if (t > eps && t < 1.0) {
                    const x = x1 + t * dx;
                    // 嚴格檢查：x 必須在 left 和 right 之間
                    if (x >= left && x <= right) {
                        candidates.push({ t, x, y: top, edge: 'top' });
                    }
                }
            }

            // 下邊: y = bottom
            if (Math.abs(dy) > eps) {
                const t = (bottom - y1) / dy;
                if (t > eps && t < 1.0) {
                    const x = x1 + t * dx;
                    if (x >= left && x <= right) {
                        candidates.push({ t, x, y: bottom, edge: 'bottom' });
                    }
                }
            }

            // 選擇最小的 t 值（最近的交點）
            if (candidates.length === 0) {
                console.warn('找不到邊緣交點，返回中心點', {
                    rect, x1, y1, x2, y2, dx, dy,
                    rectInfo: `(${rect.x}, ${rect.y}) ${rect.width}x${rect.height}`
                });
                return { x: centerX, y: centerY };
            }

            // 按 t 值排序
            candidates.sort((a, b) => a.t - b.t);
            const closest = candidates[0];

            return { x: closest.x, y: closest.y };
        }

        function updatePropertyEditor() {
            const editor = document.getElementById('property-editor');

            // 在多選模式下，顯示多選信息而不是屬性編輯器
            if (isMultiSelectMode) {
                if (multiSelectedElements.length === 0) {
                    editor.innerHTML = '<div class="property-editor-empty">多選模式：點擊元素選擇，或拖曳框選多個元素</div>';
                } else {
                    const nodeCount = multiSelectedElements.filter(el => el.type === 'node').length;
                    const frameCount = multiSelectedElements.filter(el => el.type === 'frame').length;
                    const connCount = multiSelectedElements.filter(el => el.type === 'connection').length;
                    editor.innerHTML = `<div class="property-editor-empty">已選擇 ${multiSelectedElements.length} 個元素<br>節點: ${nodeCount}, 框架: ${frameCount}, 連接線: ${connCount}</div>`;
                }
                return;
            }

            if (!selectedElement) {
                editor.innerHTML = '<div class="property-editor-empty">請選擇一個元素來編輯屬性</div>';
                return;
            }

            const { id, type } = selectedElement;
            let element;

            if (type === 'node') {
                element = currentMapData.data.nodes.find(n => n.id === id);
                if (element) {
                    editor.innerHTML = createNodePropertyEditor(element);
                    bindNodePropertyEvents(element);
                }
            } else if (type === 'frame') {
                element = currentMapData.data.frames.find(f => f.id === id);
                if (element) {
                    editor.innerHTML = createFramePropertyEditor(element);
                    bindFramePropertyEvents(element);
                }
            } else if (type === 'connection') {
                element = currentMapData.data.connections.find(c => c.id === id);
                if (element) {
                    editor.innerHTML = createConnectionPropertyEditor(element);
                    bindConnectionPropertyEvents(element);
                }
            }
        }

        // ==================== 插入連結對話框 ====================
        function openInsertLinkDialog() {
            const editorContent = document.getElementById('editor-content');
            const selection = window.getSelection();

            // 保存當前選取範圍
            if (selection.rangeCount > 0) {
                savedSelection = selection.getRangeAt(0);
            }

            // 獲取選取的文字
            const selectedText = selection.toString();

            // 檢查選取範圍是否包含連結
            let existingUrl = 'https://';
            let existingText = selectedText;

            if (savedSelection) {
                // 檢查選取範圍中是否有連結元素
                let linkElement = null;

                // 情況 1: 選取範圍的容器本身是 <a> 標籤
                if (savedSelection.commonAncestorContainer.nodeType === 1 &&
                    savedSelection.commonAncestorContainer.tagName === 'A') {
                    linkElement = savedSelection.commonAncestorContainer;
                }
                // 情況 2: 選取範圍的容器是文字節點，檢查其父元素
                else if (savedSelection.commonAncestorContainer.nodeType === 3) {
                    const parent = savedSelection.commonAncestorContainer.parentElement;
                    if (parent && parent.tagName === 'A') {
                        linkElement = parent;
                    }
                }
                // 情況 3: 在選取範圍內查找第一個 <a> 標籤
                if (!linkElement && savedSelection.commonAncestorContainer.nodeType === 1) {
                    linkElement = savedSelection.commonAncestorContainer.querySelector('a');
                }

                // 如果找到連結元素，提取其 href 和文字
                if (linkElement) {
                    existingUrl = linkElement.getAttribute('href') || 'https://';
                    existingText = linkElement.textContent || selectedText;
                }
            }

            // 填入預設值或現有連結的資料
            document.getElementById('input-link-url').value = existingUrl;
            document.getElementById('input-link-text').value = existingText;

            // 顯示對話框
            document.getElementById('modal-insert-link').classList.add('active');

            // 聚焦到網址輸入欄位
            setTimeout(() => {
                document.getElementById('input-link-url').focus();
                document.getElementById('input-link-url').select();
            }, 100);
        }

        function closeInsertLinkDialog() {

        function confirmInsertLink() {
            const url = document.getElementById('input-link-url').value.trim();
            let text = document.getElementById('input-link-text').value.trim();

            // 如果沒有輸入網址，不執行
            if (!url || url === 'https://') {
                alert('請輸入連結網址');
                return;
            }

            // 如果連結文字為空，使用網址作為顯示文字
            if (!text) {
                text = url;
            }

            // 獲取 selection 對象（在最外層定義，避免作用域問題）
            const selection = window.getSelection();

            // 恢復選取範圍
            if (savedSelection) {
                selection.removeAllRanges();
                selection.addRange(savedSelection);
            }

            // 插入連結
            const editorContent = document.getElementById('editor-content');
            editorContent.focus();

            // 如果有選取範圍，刪除選取的內容
            if (savedSelection && !savedSelection.collapsed) {
                savedSelection.deleteContents();
            }

            // 創建連結元素
            const link = document.createElement('a');
            link.href = url;
            link.textContent = text;

            // 插入連結
            if (savedSelection) {
                savedSelection.insertNode(link);
                // 將游標移到連結後面
                const range = document.createRange();
                range.setStartAfter(link);
                range.collapse(true);
                selection.removeAllRanges();
                selection.addRange(range);
            }

            closeInsertLinkDialog();
        }

        // 輔助函數：將 rgba 轉換為 hex
        function rgbaToHex(rgba) {
            if (!rgba) return '#95a5a6';
            const match = rgba.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)/);
            if (!match) return '#95a5a6';
            const r = parseInt(match[1]).toString(16).padStart(2, '0');
            const g = parseInt(match[2]).toString(16).padStart(2, '0');
            const b = parseInt(match[3]).toString(16).padStart(2, '0');
            return `#${r}${g}${b}`;
        }

        // 輔助函數：獲取 rgba 的透明度
        function getOpacity(rgba) {
            if (!rgba) return 10;
            const match = rgba.match(/rgba?\([^,]+,[^,]+,[^,]+,?\s*([\d.]+)?\)/);
            if (match && match[1]) {
                return Math.round(parseFloat(match[1]) * 100);
            }
            return 10;
        }

        // 輔助函數：將 hex 轉換為 rgba
        function hexToRgba(hex, opacity) {
            const r = parseInt(hex.slice(1, 3), 16);
            const g = parseInt(hex.slice(3, 5), 16);
            const b = parseInt(hex.slice(5, 7), 16);
            return `rgba(${r}, ${g}, ${b}, ${opacity})`;
        }

        // 多選輔助函數
        function isElementMultiSelected(id, type) {
            return multiSelectedElements.some(el => el.id === id && el.type === type);
        }

        function toggleElementMultiSelection(id, type) {
            const index = multiSelectedElements.findIndex(el => el.id === id && el.type === type);
            if (index >= 0) {
                // 已選中，移除
                multiSelectedElements.splice(index, 1);

                // 如果是節點或框架，也要移除所有與它連接的連接線
                if (type === 'node' || type === 'frame') {
                    if (currentMapData && currentMapData.data.connections) {
                        currentMapData.data.connections.forEach(conn => {
                            if (conn.from === id || conn.to === id) {
                                const connIndex = multiSelectedElements.findIndex(el => el.id === conn.id && el.type === 'connection');
                                if (connIndex >= 0) {
                                    multiSelectedElements.splice(connIndex, 1);
                                }
                            }
                        });
                    }
                }
            } else {
                // 未選中，添加
                multiSelectedElements.push({ id, type });
            }

            // 更新屬性編輯器和按鈕狀態
            updatePropertyEditor();
            updateCopyPasteButtons();
            renderCanvas();
        }

        function isElementInRect(element, rectLeft, rectTop, rectWidth, rectHeight) {
            // 檢查元素是否與選擇矩形相交
            const elemRight = element.x + element.width;
            const elemBottom = element.y + element.height;
            const rectRight = rectLeft + rectWidth;
            const rectBottom = rectTop + rectHeight;

            // 檢查是否有交集
            return !(element.x > rectRight ||
                elemRight < rectLeft ||
                element.y > rectBottom ||
                elemBottom < rectTop);
        }

        function toggleConnectionMultiSelection(connectionId, fromId, toId) {
            const index = multiSelectedElements.findIndex(el => el.id === connectionId && el.type === 'connection');

            if (index >= 0) {
                // 已選中，移除連接線（不移除兩端元素）
                multiSelectedElements.splice(index, 1);
            } else {
                // 未選中，添加連接線和兩端元素
                multiSelectedElements.push({ id: connectionId, type: 'connection' });

                // 找出兩端元素的類型
                const fromNode = currentMapData.data.nodes.find(n => n.id === fromId);
                const fromFrame = currentMapData.data.frames.find(f => f.id === fromId);
                const toNode = currentMapData.data.nodes.find(n => n.id === toId);
                const toFrame = currentMapData.data.frames.find(f => f.id === toId);

                // 添加起點元素
                if (fromNode && !isElementMultiSelected(fromId, 'node')) {
                    multiSelectedElements.push({ id: fromId, type: 'node' });
                } else if (fromFrame && !isElementMultiSelected(fromId, 'frame')) {
                    multiSelectedElements.push({ id: fromId, type: 'frame' });
                }

                // 添加終點元素
                if (toNode && !isElementMultiSelected(toId, 'node')) {
                    multiSelectedElements.push({ id: toId, type: 'node' });
                } else if (toFrame && !isElementMultiSelected(toId, 'frame')) {
                    multiSelectedElements.push({ id: toId, type: 'frame' });
                }
            }

            // 更新屬性編輯器和按鈕狀態
            updatePropertyEditor();
            updateCopyPasteButtons();
            renderCanvas();
        }

        // 判斷兩線段是否相交
        function lineIntersectsLine(x1, y1, x2, y2, x3, y3, x4, y4) {
            const denom = (y4 - y3) * (x2 - x1) - (x4 - x3) * (y2 - y1);
            if (denom === 0) return false;

            const ua = ((x4 - x3) * (y1 - y3) - (y4 - y3) * (x1 - x3)) / denom;
            const ub = ((x2 - x1) * (y1 - y3) - (y2 - y1) * (x1 - x3)) / denom;

            return ua >= 0 && ua <= 1 && ub >= 0 && ub <= 1;
        }

        // 判斷線段是否在矩形內（包含相交）
        function isLineInRect(x1, y1, x2, y2, rectLeft, rectTop, rectWidth, rectHeight) {
            const rectRight = rectLeft + rectWidth;
            const rectBottom = rectTop + rectHeight;

            // 1. 檢查線段端點是否在矩形內
            if ((x1 >= rectLeft && x1 <= rectRight && y1 >= rectTop && y1 <= rectBottom) ||
                (x2 >= rectLeft && x2 <= rectRight && y2 >= rectTop && y2 <= rectBottom)) {
                return true;
            }

            // 2. 檢查線段是否與矩形的四條邊相交
            // 上邊
            if (lineIntersectsLine(x1, y1, x2, y2, rectLeft, rectTop, rectRight, rectTop)) return true;
            // 下邊
            if (lineIntersectsLine(x1, y1, x2, y2, rectLeft, rectBottom, rectRight, rectBottom)) return true;
            // 左邊
            if (lineIntersectsLine(x1, y1, x2, y2, rectLeft, rectTop, rectLeft, rectBottom)) return true;
            // 右邊
            if (lineIntersectsLine(x1, y1, x2, y2, rectRight, rectTop, rectRight, rectBottom)) return true;

            return false;
        }

        function startResize(e, element, type) {
            e.preventDefault();
            e.stopPropagation();
            isResizing = true;
            resizeTarget = { type, element };

            // 支持滑鼠和觸控事件
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;

            // 記錄開始狀態的詳細資訊
            // 轉換為畫布座標
            const startX = (clientX - offsetX) / scale;
            const startY = (clientY - offsetY) / scale;

            resizeStartInfo = {
                startX: startX,
                startY: startY,
                startWidth: element.width,
                startHeight: element.height,
                elementX: element.x,
                elementY: element.y
            };



        }

        function handleConnectionClick(id, type) {
