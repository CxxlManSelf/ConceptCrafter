                    <button class="toolbar-btn accent" id="btn-delete-element" style="width: 100%;">🗑️ 刪除節點</button>
                </div>
            `;
        }

        function createFramePropertyEditor(frame) {
            return `
                <div class="property-group">
                    <label class="property-label">標籤文字：</label>
                    <input type="text" class="property-input" id="prop-frame-label" value="${frame.label || ''}" placeholder="框架標籤">
                </div>
                <div class="property-group">
                    <label class="property-label">邊框顏色：</label>
                    <input type="color" class="property-input" id="prop-frame-border-color" value="${frame.borderColor || '#95a5a6'}">
                </div>
                <div class="property-group">
                    <label class="property-label">背景顏色：</label>
                    <input type="color" class="property-input" id="prop-frame-bg-color" value="${rgbaToHex(frame.bgColor) || '#95a5a6'}">
                </div>
                <div class="property-group">
                    <label class="property-label">背景透明度：</label>
                    <input type="range" class="property-input" id="prop-frame-opacity" value="${getOpacity(frame.bgColor)}" min="0" max="100" step="5">
                    <span id="opacity-value">${getOpacity(frame.bgColor)}%</span>
                </div>
                <div class="property-group">
                    <label class="property-label">寬度：</label>
                    <input type="number" class="property-input" id="prop-frame-width" value="${frame.width}" min="100">
                </div>
                <div class="property-group">
                    <label class="property-label">高度：</label>
                    <input type="number" class="property-input" id="prop-frame-height" value="${frame.height}" min="100">
                </div>
                <div class="property-group" style="margin-top: 20px;">
                    <button class="toolbar-btn accent" id="btn-delete-element" style="width: 100%;">🗑️ 刪除框架</button>
                </div>
            `;
        }

        function bindNodePropertyEvents(node) {
            document.getElementById('prop-node-text').addEventListener('input', (e) => {
                node.text = e.target.value;
                renderCanvas();
                markMapAsModified();
            });

            // 進階編輯按鈕
            document.getElementById('btn-advanced-editor').addEventListener('click', () => {
                openAdvancedEditor(node);
            });

            document.getElementById('prop-node-color').addEventListener('input', (e) => {
                node.color = e.target.value;
                renderCanvas();
                markMapAsModified();
            });

            document.getElementById('prop-node-align').addEventListener('change', (e) => {
                node.textAlign = e.target.value;
                renderCanvas();
                markMapAsModified();
            });

            document.getElementById('prop-node-width').addEventListener('input', (e) => {
                node.width = parseInt(e.target.value);
                renderCanvas();
                markMapAsModified();
            });

            document.getElementById('prop-node-height').addEventListener('input', (e) => {
                node.height = parseInt(e.target.value);
                renderCanvas();
                markMapAsModified();
            });

            document.getElementById('prop-node-link').addEventListener('input', (e) => {
                node.link = e.target.value;
                markMapAsModified();
            });

            document.getElementById('btn-delete-element').addEventListener('click', () => {
                if (confirm('確定要刪除這個節點嗎？')) {
                    const index = currentMapData.data.nodes.findIndex(n => n.id === node.id);
                    if (index !== -1) {
                        currentMapData.data.nodes.splice(index, 1);
                        selectedElement = null;
                        updatePropertyEditor();
                        renderCanvas();
                        saveHistory();
                        markMapAsModified();
                    }
                }
            });
        }

        function bindFramePropertyEvents(frame) {
            document.getElementById('prop-frame-label').addEventListener('input', (e) => {
                frame.label = e.target.value;
                renderCanvas();
                markMapAsModified();
            });

            document.getElementById('prop-frame-border-color').addEventListener('input', (e) => {
                frame.borderColor = e.target.value;
                renderCanvas();
                markMapAsModified();
            });

            const bgColorInput = document.getElementById('prop-frame-bg-color');
            const opacityInput = document.getElementById('prop-frame-opacity');
            const opacityValue = document.getElementById('opacity-value');

            bgColorInput.addEventListener('input', (e) => {
                const opacity = parseInt(opacityInput.value) / 100;
                frame.bgColor = hexToRgba(e.target.value, opacity);
                renderCanvas();
                markMapAsModified();
            });

            opacityInput.addEventListener('input', (e) => {
                const opacity = parseInt(e.target.value) / 100;
                opacityValue.textContent = e.target.value + '%';
                const color = bgColorInput.value;
                frame.bgColor = hexToRgba(color, opacity);
                renderCanvas();
                markMapAsModified();
            });

            document.getElementById('prop-frame-width').addEventListener('input', (e) => {
                frame.width = parseInt(e.target.value);
                renderCanvas();
                markMapAsModified();
            });

            document.getElementById('prop-frame-height').addEventListener('input', (e) => {
                frame.height = parseInt(e.target.value);
                renderCanvas();
                markMapAsModified();
            });

            document.getElementById('btn-delete-element').addEventListener('click', () => {
                if (confirm('確定要刪除這個框架嗎？')) {
                    const index = currentMapData.data.frames.findIndex(f => f.id === frame.id);
                    if (index !== -1) {
                        currentMapData.data.frames.splice(index, 1);
                        selectedElement = null;
                        updatePropertyEditor();
                        renderCanvas();
                        saveHistory();
                        markMapAsModified();
                    }
                }
            });
        }

        // ==================== 進階文字編輯器 ====================
        let currentEditingNode = null;
        let isHtmlMode = false;

        function openAdvancedEditor(node) {
            currentEditingNode = node;
            isHtmlMode = false;
            const editorContent = document.getElementById('editor-content');
            editorContent.innerHTML = node.text || '';
            editorContent.setAttribute('contenteditable', 'true');

            // 確保所有格式按鈕可用
            enableFormatButtons();

            document.getElementById('modal-advanced-editor').classList.add('active');

            // 聚焦到編輯器
            setTimeout(() => editorContent.focus(), 100);
        }

        function closeAdvancedEditor() {
            document.getElementById('modal-advanced-editor').classList.remove('active');
            currentEditingNode = null;
            isHtmlMode = false;
        }

        function enableFormatButtons() {
            document.querySelectorAll('.format-btn').forEach(btn => {
                btn.disabled = false;
            });
        }

        function disableFormatButtons() {
            document.querySelectorAll('.format-btn').forEach(btn => {
                btn.disabled = true;
            });
        }

        function toggleHtmlMode() {
            const editorContent = document.getElementById('editor-content');
            const toggleBtn = document.getElementById('btn-toggle-html');

            if (!isHtmlMode) {
                // 切換到 HTML 模式
                const html = editorContent.innerHTML;
                editorContent.textContent = html; // 顯示原始 HTML
                editorContent.setAttribute('contenteditable', 'true');
                editorContent.classList.add('html-mode');
                isHtmlMode = true;
                toggleBtn.classList.add('active');
                disableFormatButtons();
            } else {
                // 切換回視覺模式
                const html = editorContent.textContent;
                editorContent.innerHTML = html; // 解析 HTML
                editorContent.setAttribute('contenteditable', 'true');
                editorContent.classList.remove('html-mode');
                isHtmlMode = false;
                toggleBtn.classList.remove('active');
                enableFormatButtons();
            }

            editorContent.focus();
        }

        function confirmAdvancedEditor() {
            if (currentEditingNode) {
                const editorContent = document.getElementById('editor-content');

                // 如果在 HTML 模式，先切換回來以獲取正確的 HTML
                if (isHtmlMode) {
                    const html = editorContent.textContent;
                    currentEditingNode.text = html;
                } else {
                    currentEditingNode.text = editorContent.innerHTML;
                }

                // 更新簡單編輯器的內容
                const simpleTextarea = document.getElementById('prop-node-text');
                if (simpleTextarea) {
                    // 創建臨時元素來提取純文字
                    const temp = document.createElement('div');
                    temp.innerHTML = currentEditingNode.text;
                    simpleTextarea.value = temp.innerText;
                }

                renderCanvas();
                markMapAsModified();
            }
            closeAdvancedEditor();
        }

        // 初始化進階編輯器
        function initAdvancedEditor() {
            // 工具列按鈕事件
            document.querySelectorAll('.editor-btn[data-command]').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.preventDefault();
                    const command = btn.dataset.command;
                    document.execCommand(command, false, null);
                    document.getElementById('editor-content').focus();
                });
            });

            // 字體大小
            document.getElementById('editor-font-size').addEventListener('change', (e) => {
                document.execCommand('fontSize', false, e.target.value);
                document.getElementById('editor-content').focus();
            });

            // 文字顏色
            document.getElementById('editor-text-color').addEventListener('change', (e) => {
                document.execCommand('foreColor', false, e.target.value);
                document.getElementById('editor-content').focus();
            });

            // 清除格式
            document.getElementById('btn-clear-format').addEventListener('click', (e) => {
                e.preventDefault();
                document.execCommand('removeFormat', false, null);
                document.getElementById('editor-content').focus();
            });

            // 插入連結
            document.getElementById('btn-insert-link').addEventListener('click', (e) => {
                e.preventDefault();
                const url = prompt('請輸入連結網址：', 'https://');
                if (url && url !== 'https://') {
                    document.execCommand('createLink', false, url);
                    document.getElementById('editor-content').focus();
                }
            });

            // 切換 HTML 模式
            document.getElementById('btn-toggle-html').addEventListener('click', (e) => {
                e.preventDefault();
                toggleHtmlMode();
            });

            // 取消按鈕
            document.getElementById('btn-cancel-advanced-editor').addEventListener('click', closeAdvancedEditor);

            // 確定按鈕
            document.getElementById('btn-confirm-advanced-editor').addEventListener('click', confirmAdvancedEditor);
        }

        // 輔助函數：將 rgba 轉換為 hex
        function rgbaToHex(rgba) {
            if (!rgba) return '#95a5a6';
            const match = rgba.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)/);
            if (!match) return '#95a5a6';
            const r = parseInt(match[1]).toString(16).padStart(2, '0');
            const g = parseInt(match[2]).toString(16).padStart(2, '0');
            const b = parseInt(match[3]).toString(16).padStart(2, '0');
            return `#${r}${g}${b}`;
        }

        // 輔助函數：獲取 rgba 的透明度
        function getOpacity(rgba) {
            if (!rgba) return 10;
            const match = rgba.match(/rgba?\([^,]+,[^,]+,[^,]+,?\s*([\d.]+)?\)/);
            if (match && match[1]) {
                return Math.round(parseFloat(match[1]) * 100);
            }
            return 10;
        }

        // 輔助函數：將 hex 轉換為 rgba
        function hexToRgba(hex, opacity) {
            const r = parseInt(hex.slice(1, 3), 16);
            const g = parseInt(hex.slice(3, 5), 16);
            const b = parseInt(hex.slice(5, 7), 16);
            return `rgba(${r}, ${g}, ${b}, ${opacity})`;
        }

        // ==================== 元素操作 ====================
        function addNode() {
            if (!currentMapData) {
                alert('請先建立或開啟一個概念圖');
                return;
            }

            const node = {
                id: 'node-' + Date.now(),
                x: Math.max(0, (window.innerWidth / 2 - offsetX) / scale - 100),
                y: Math.max(0, (window.innerHeight / 2 - offsetY) / scale - 50),
                width: 200,
                height: 100,
                text: '新節點',
                color: '#3498db',
                textAlign: 'center',
                completed: false,
                abandoned: false,
                link: ''
            };

            currentMapData.data.nodes.push(node);
            renderCanvas();
            saveHistory();
            markMapAsModified();
        }

        function addFrame() {
            if (!currentMapData) {
                alert('請先建立或開啟一個概念圖');
                return;
            }

            const frame = {
                id: 'frame-' + Date.now(),
                x: Math.max(0, (window.innerWidth / 2 - offsetX) / scale - 200),
                y: Math.max(0, (window.innerHeight / 2 - offsetY) / scale - 150),
                width: 400,
                height: 300,
                label: '新框架',
                borderColor: '#95a5a6',
                bgColor: 'rgba(149, 165, 166, 0.1)',
                zIndex: 0,
                completed: false,
                abandoned: false
            };

            currentMapData.data.frames.push(frame);
            renderCanvas();
            saveHistory();
            markMapAsModified();
        }

        // ==================== 歷史記錄 ====================
        function saveHistory() {
            if (!currentMapData) return;

            // 移除當前索引之後的歷史
            history = history.slice(0, historyIndex + 1);

            // 添加新的歷史記錄
            history.push(JSON.stringify(currentMapData));
            historyIndex++;

            // 限制歷史記錄數量
            if (history.length > 50) {
                history.shift();
                historyIndex--;
            }
        }

        function undo() {
            if (historyIndex > 0) {
                historyIndex--;
                currentMapData = JSON.parse(history[historyIndex]);
                renderCanvas();
                markMapAsModified();
            }
        }

        function redo() {
            if (historyIndex < history.length - 1) {
                historyIndex++;
                currentMapData = JSON.parse(history[historyIndex]);
                renderCanvas();
                markMapAsModified();
            }
        }

        // ==================== 變動追蹤 ====================
        function markMapAsModified() {
            if (currentFileName) {
                mapModifiedStatus[currentFileName] = true;

                // 只更新該項目的顯示狀態
                const mapItem = document.querySelector(`[data-filename="${currentFileName}"]`);
                if (mapItem) {
                    const parentItem = mapItem.closest('.map-item');
                    if (parentItem) {
                        // 重新創建列表項以顯示「儲存」按鈕和「已修改」標籤
                        const newItem = createMapListItem(currentFileName);
                        parentItem.replaceWith(newItem);
                    }
                }
            }
        }

        // ==================== 匯出功能 ====================
        function generateMapHTML(mapData) {
            // ⚠️ 重要：確保所有元素包含所有必須的屬性
            const normalizedData = {
                title: mapData.title,
                data: {
                    nodes: (mapData.data.nodes || []).map(node => ({
                        id: node.id,
                        x: node.x,
                        y: node.y,
                        width: node.width,
                        height: node.height,
                        text: node.text || '',
                        color: node.color || '#3498db',
                        textAlign: node.textAlign || 'center',
                        completed: node.completed || false,
                        abandoned: node.abandoned || false,
                        link: node.link || ''
                    })),
                    frames: (mapData.data.frames || []).map(frame => ({
                        id: frame.id,
                        x: frame.x,
                        y: frame.y,
                        width: frame.width,
                        height: frame.height,
                        label: frame.label || '',
                        borderColor: frame.borderColor || '#95a5a6',
                        bgColor: frame.bgColor || 'rgba(149, 165, 166, 0.1)',
                        zIndex: frame.zIndex || 0,
                        completed: frame.completed || false,
                        abandoned: frame.abandoned || false
                    })),
                    connections: (mapData.data.connections || []).map(conn => ({
                        id: conn.id,
                        from: conn.from,
                        to: conn.to,
                        arrowType: conn.arrowType || 'single',
                        label: conn.label || '',
                        color: conn.color || '#2c3e50'
                    }))
                }
            };

            // 使用 JSON.stringify 生成數據（符合規範）
            const jsonString = JSON.stringify(normalizedData, null, 4);

            // 注意：必須拆分 <script> 標籤，避免瀏覽器 HTML 解析器混淆
            const scriptOpen = '<' + 'script';
            const scriptClose = '</' + 'script>';

            return `<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>${normalizedData.title} - Concept Map Viewer</title>
    <link rel="icon" type="image/png" href="./concept-crafter_icon.png">
    <style>

            background: #e74c3c;
            color: white;

            fill: #2c3e50;

            pointer-events: none;

    </style>
    ${scriptOpen} id="map-data" type="application/json">

<body>
    <div id="map-title">${normalizedData.title}</div>
    <div id="container">
        <svg id="svg-layer"></svg>
        <div id="canvas"></div>
    </div>
    ${scriptOpen}>
        class MapViewer {
            constructor() {
                this.container = document.getElementById('container');
                this.canvas = document.getElementById('canvas');
                this.svgLayer = document.getElementById('svg-layer');

                this.data = JSON.parse(document.getElementById('map-data').textContent);
                this.nodes = this.data.data.nodes || [];
                this.frames = this.data.data.frames || [];
                this.connections = this.data.data.connections || [];

                this.scale = 1;
                this.offsetX = 0;
                this.offsetY = 0;
                this.isPanning = false;

                this.init();
            }

            init() {
                this.updateSVGSize();
                this.setupEventListeners();
                this.render();
            }

            setupEventListeners() {
                this.container.addEventListener('mousedown', (e) => {
                    this.isPanning = true;
                    this.panStart = { x: e.clientX, y: e.clientY };
                    this.container.classList.add('grabbing');
                });

                window.addEventListener('mousemove', (e) => {
                    if (this.isPanning) {
                        this.offsetX += e.clientX - this.panStart.x;
                        this.offsetY += e.clientY - this.panStart.y;
                        this.panStart = { x: e.clientX, y: e.clientY };
                        this.render();
                    }
                });

                window.addEventListener('mouseup', () => {
                    this.isPanning = false;
                    this.container.classList.remove('grabbing');
                });

                this.container.addEventListener('wheel', (e) => {
                    e.preventDefault();
                    const delta = e.deltaY > 0 ? 0.9 : 1.1;
                    const rect = this.container.getBoundingClientRect();
                    const mouseX = e.clientX - rect.left;
                    const mouseY = e.clientY - rect.top;

                    this.offsetX = mouseX - (mouseX - this.offsetX) * delta;
                    this.offsetY = mouseY - (mouseY - this.offsetY) * delta;
                    this.scale *= delta;
                    this.scale = Math.max(0.1, Math.min(5, this.scale));
                    this.render();
                });

                window.addEventListener('resize', () => this.updateSVGSize());
            }

            render() {
                this.canvas.innerHTML = '';
                this.svgLayer.innerHTML = '';

                const sortedFrames = [...this.frames].sort((a, b) => (a.zIndex || 0) - (b.zIndex || 0));
                sortedFrames.forEach(frame => this.renderFrame(frame));

                this.nodes.forEach(node => this.renderNode(node));

                this.updateConnections();

                this.canvas.style.transform = \`translate(\${this.offsetX}px, \${this.offsetY}px) scale(\${this.scale})\`;
            }

            renderNode(node) {
                const nodeEl = document.createElement('div');
                nodeEl.className = 'node';
                nodeEl.style.left = node.x + 'px';
                nodeEl.style.top = node.y + 'px';
                nodeEl.style.width = node.width + 'px';
                nodeEl.style.height = node.height + 'px';
                nodeEl.style.background = node.color || '#3498db';
                nodeEl.style.textAlign = node.textAlign || 'center';

                // 根據文字對齊設置 flexbox 的 justify-content
                const textAlign = node.textAlign || 'center';
                if (textAlign === 'left') {
                    nodeEl.style.justifyContent = 'flex-start';
                } else if (textAlign === 'right') {
                    nodeEl.style.justifyContent = 'flex-end';
                } else {
                    nodeEl.style.justifyContent = 'center';
                }

                nodeEl.innerHTML = node.text || '';

                // 處理節點本身的連結
                if (node.link && node.link.trim() !== '') {
                    nodeEl.classList.add('has-link');

                    // 判斷是否為專案 HTML 檔案
                    const isProjectHtml = !node.link.match(/^[a-zA-Z]+:\\/\\//) &&    // 沒有協議
                                         !node.link.match(/^\\//) &&                  // 不是 Unix 絕對路徑
                                         !node.link.match(/^[a-zA-Z]:[\/\\\\]/) &&    // 不是 Windows 絕對路徑
                                         node.link.match(/\\.html?$/i);               // 結尾是 .html 或 .htm

                    nodeEl.addEventListener('click', (e) => {
                        // 如果點擊的是文字內容中的 <a> 標籤，不觸發節點連結
                        if (e.target.tagName === 'A') {
                            return;
                        }

                        if (isProjectHtml) {
                            // 專案 HTML 檔案：同一視窗打開
                            window.location.href = node.link;
                        } else {
                            // 外部連結：新視窗打開
                            window.open(node.link, '_blank', 'noopener,noreferrer');
                        }
                    });

                    // 添加連結圖標
                    const linkIcon = document.createElement('div');
                    linkIcon.className = 'node-link-icon';
                    linkIcon.textContent = '🔗';
                    nodeEl.appendChild(linkIcon);
                }

                // 處理文字內容中的 <a> 標籤：專案 HTML 檔案在同一視窗打開，外部連結在新視窗打開
                const links = nodeEl.querySelectorAll('a');
                links.forEach(link => {
                    const href = link.getAttribute('href');
                    if (href) {
                        // 判斷是否為專案 HTML 檔案
                        const isProjectHtml = !href.match(/^[a-zA-Z]+:\\/\\//) &&    // 沒有協議
                                             !href.match(/^\\//) &&                  // 不是 Unix 絕對路徑
                                             !href.match(/^[a-zA-Z]:[\/\\\\]/) &&    // 不是 Windows 絕對路徑
                                             href.match(/\\.html?$/i);               // 結尾是 .html 或 .htm

                        if (!isProjectHtml) {
                            // 外部連結：新視窗打開
                            link.setAttribute('target', '_blank');
                            link.setAttribute('rel', 'noopener noreferrer');
                        }
                        // 專案 HTML 檔案：不設置 target，在同一視窗打開（預設行為）
                    }
                });

                if (node.completed || node.abandoned) {
                    const badge = document.createElement('div');
                    badge.className = \`status-badge \${node.completed ? 'status-completed' : 'status-abandoned'}\`;
                    badge.textContent = node.completed ? '✓' : '✗';
                    nodeEl.appendChild(badge);
                }

                this.canvas.appendChild(nodeEl);
            }

            renderFrame(frame) {
                const frameEl = document.createElement('div');
                frameEl.className = 'frame';
                frameEl.style.left = frame.x + 'px';
                frameEl.style.top = frame.y + 'px';
                frameEl.style.width = frame.width + 'px';
                frameEl.style.height = frame.height + 'px';
                frameEl.style.borderColor = frame.borderColor || '#95a5a6';
                frameEl.style.background = frame.bgColor || 'rgba(149, 165, 166, 0.1)';
                frameEl.style.zIndex = frame.zIndex || 0;

                if (frame.label) {
                    const label = document.createElement('div');
                    label.className = 'frame-label';
                    label.textContent = frame.label;
                    frameEl.appendChild(label);
                }

                if (frame.completed || frame.abandoned) {
                    const badge = document.createElement('div');
                    badge.className = \`status-badge \${frame.completed ? 'status-completed' : 'status-abandoned'}\`;
                    badge.textContent = frame.completed ? '✓' : '✗';
                    frameEl.appendChild(badge);
                }

                this.canvas.appendChild(frameEl);
            }

            updateConnections() {
                const defs = document.createElementNS('http://www.w3.org/2000/svg', 'defs');

                const colors = new Set();
                this.connections.forEach(conn => {
                    colors.add(conn.color || '#2c3e50');
                });

                colors.forEach(color => {
                    const colorId = color.replace('#', '');

                    const markerSingle = document.createElementNS('http://www.w3.org/2000/svg', 'marker');
                    markerSingle.setAttribute('id', \`arrowhead-single-\${colorId}\`);
                    markerSingle.setAttribute('markerWidth', '10');
                    markerSingle.setAttribute('markerHeight', '10');
                    markerSingle.setAttribute('refX', '9');
                    markerSingle.setAttribute('refY', '3');
                    markerSingle.setAttribute('orient', 'auto');
                    const pathSingle = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                    pathSingle.setAttribute('d', 'M0,0 L0,6 L9,3 z');
                    pathSingle.setAttribute('fill', color);
                    markerSingle.appendChild(pathSingle);
                    defs.appendChild(markerSingle);

                    const markerDouble = document.createElementNS('http://www.w3.org/2000/svg', 'marker');
                    markerDouble.setAttribute('id', \`arrowhead-double-\${colorId}\`);
                    markerDouble.setAttribute('markerWidth', '10');
                    markerDouble.setAttribute('markerHeight', '10');
                    markerDouble.setAttribute('refX', '0');
                    markerDouble.setAttribute('refY', '3');
                    markerDouble.setAttribute('orient', 'auto');
                    const pathDouble = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                    pathDouble.setAttribute('d', 'M9,0 L9,6 L0,3 z');
                    pathDouble.setAttribute('fill', color);
                    markerDouble.appendChild(pathDouble);
                    defs.appendChild(markerDouble);
                });

                this.svgLayer.appendChild(defs);

                this.connections.forEach(conn => {
                    const fromNode = this.nodes.find(n => n.id === conn.from) ||
                                     this.frames.find(f => f.id === conn.from);
                    const toNode = this.nodes.find(n => n.id === conn.to) ||
                                   this.frames.find(f => f.id === conn.to);
                    if (!fromNode || !toNode) return;

                    const fromCenter = {
                        x: fromNode.x + fromNode.width / 2,
                        y: fromNode.y + fromNode.height / 2
                    };
                    const toCenter = {
                        x: toNode.x + toNode.width / 2,
                        y: toNode.y + toNode.height / 2
                    };

                    const fromEdge = this.getEdgePoint(fromNode, fromCenter, toCenter);
                    const toEdge = this.getEdgePoint(toNode, toCenter, fromCenter);

                    const x1 = fromEdge.x * this.scale + this.offsetX;
                    const y1 = fromEdge.y * this.scale + this.offsetY;
                    const x2 = toEdge.x * this.scale + this.offsetX;
                    const y2 = toEdge.y * this.scale + this.offsetY;

                    const lineColor = conn.color || '#2c3e50';
                    const colorId = lineColor.replace('#', '');

                    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                    line.setAttribute('x1', x1);
                    line.setAttribute('y1', y1);
                    line.setAttribute('x2', x2);
                    line.setAttribute('y2', y2);
                    line.setAttribute('stroke', lineColor);
                    line.setAttribute('stroke-width', '2');

                    if (conn.arrowType === 'single') {
                        line.setAttribute('marker-end', \`url(#arrowhead-single-\${colorId})\`);
                    } else if (conn.arrowType === 'double') {
                        line.setAttribute('marker-start', \`url(#arrowhead-double-\${colorId})\`);
                        line.setAttribute('marker-end', \`url(#arrowhead-single-\${colorId})\`);
                    }

                    this.svgLayer.appendChild(line);

                    if (conn.label) {
                        const midX = (x1 + x2) / 2;
                        const midY = (y1 + y2) / 2;
                        const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                        text.setAttribute('x', midX);
                        text.setAttribute('y', midY - 5);
                        text.setAttribute('text-anchor', 'middle');
                        text.setAttribute('font-size', '12');
                        text.setAttribute('class', 'connection-label');
                        text.textContent = conn.label;
                        this.svgLayer.appendChild(text);
                    }
                });
            }

            getEdgePoint(element, center, targetCenter) {
                const dx = targetCenter.x - center.x;
                const dy = targetCenter.y - center.y;

                const halfWidth = element.width / 2;
                const halfHeight = element.height / 2;

                const angle = Math.atan2(dy, dx);

                const corners = [
                    { x: halfWidth, y: halfHeight },
                    { x: -halfWidth, y: halfHeight },
                    { x: -halfWidth, y: -halfHeight },
                    { x: halfWidth, y: -halfHeight }
                ];

                const edgeAngles = corners.map((corner, i) => {
                    const nextCorner = corners[(i + 1) % 4];
                    return Math.atan2(corner.y, corner.x);
                });

                let edgeX, edgeY;

                if (Math.abs(dx) / halfWidth > Math.abs(dy) / halfHeight) {
                    edgeX = center.x + (dx > 0 ? halfWidth : -halfWidth);
                    edgeY = center.y + (edgeX - center.x) * dy / dx;
                } else {
                    edgeY = center.y + (dy > 0 ? halfHeight : -halfHeight);
                    edgeX = center.x + (edgeY - center.y) * dx / dy;
                }

                return { x: edgeX, y: edgeY };
            }

            updateSVGSize() {
                const rect = this.container.getBoundingClientRect();
                this.svgLayer.setAttribute('width', rect.width);
                this.svgLayer.setAttribute('height', rect.height);
            }
        }

        new MapViewer();
    ${scriptClose}>
</body>
</html>`;
        }

        // ==================== 工具函數 ====================
        function showLoading() {
            document.getElementById('loading').classList.add('active');
        }

        function hideLoading() {
            document.getElementById('loading').classList.remove('active');
        }
    </script>
