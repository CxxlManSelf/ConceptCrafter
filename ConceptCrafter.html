<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Concept Crafter - 概念地圖編輯器</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <!-- 工具列 -->
    <div class="toolbar">
        <div class="toolbar-section">
            <h1 class="app-title">Concept Crafter</h1>
        </div>

        <div class="toolbar-section">
            <button class="tool-btn" id="selectTool" data-tool="select" title="選擇工具 (V)">
                <svg width="20" height="20" viewBox="0 0 20 20">
                    <path d="M2 2 L2 18 L7 13 L10 18 L12 17 L9 12 L15 12 Z" fill="currentColor" />
                </svg>
            </button>
            <button class="tool-btn" id="nodeTool" data-tool="node" title="建立節點 (N)">
                <svg width="20" height="20" viewBox="0 0 20 20">
                    <rect x="3" y="3" width="14" height="14" rx="2" fill="none" stroke="currentColor"
                        stroke-width="2" />
                </svg>
            </button>
            <button class="tool-btn" id="connectionTool" data-tool="connection" title="建立連接線 (C)">
                <svg width="20" height="20" viewBox="0 0 20 20">
                    <line x1="2" y1="10" x2="18" y2="10" stroke="currentColor" stroke-width="2" />
                    <polygon points="18,10 14,7 14,13" fill="currentColor" />
                </svg>
            </button>
            <button class="tool-btn" id="frameTool" data-tool="frame" title="建立 Frame (F)">
                <svg width="20" height="20" viewBox="0 0 20 20">
                    <rect x="2" y="2" width="16" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-dasharray="3,3" />
                </svg>
            </button>
        </div>

        <div class="toolbar-section">
            <button class="btn" id="openFolderBtn" title="開啟專案資料夾">📁 開啟資料夾</button>
            <button class="btn" id="saveBtn" title="儲存當前檔案" disabled>💾 儲存</button>
            <button class="btn" id="newFileBtn" title="建立新檔案" disabled>📄 新檔案</button>
        </div>

        <div class="toolbar-section">
            <button class="btn btn-icon" id="zoomOutBtn" title="縮小 (-)">-</button>
            <span class="zoom-display" id="zoomDisplay">100%</span>
            <button class="btn btn-icon" id="zoomInBtn" title="放大 (+)">+</button>
            <button class="btn btn-icon" id="zoomResetBtn" title="重設縮放 (0)">⟲</button>
        </div>
    </div>

    <!-- 主要內容區 -->
    <div class="main-content">
        <!-- 側邊欄 -->
        <div class="sidebar" id="sidebar">
            <div class="sidebar-section">
                <h3>專案</h3>
                <div id="projectInfo" class="project-info">
                    <p class="hint">請先開啟專案資料夾</p>
                </div>
                <div id="fileList" class="file-list"></div>
            </div>

            <div class="sidebar-section" id="propertiesPanel" style="display: none;">
                <h3>屬性</h3>
                <div id="propertiesContent"></div>
            </div>
        </div>

        <!-- 畫布區域 -->
        <div class="canvas-container" id="canvasContainer">
            <svg id="canvas" class="canvas">
                <defs>
                    <!-- 箭頭標記 -->
                    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                        <polygon points="0 0, 10 3, 0 6" fill="#64b5f6" />
                    </marker>
                    <marker id="arrowhead-selected" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                        <polygon points="0 0, 10 3, 0 6" fill="#42a5f5" />
                    </marker>

                    <!-- 網格圖樣 -->
                    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
                        <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#333" stroke-width="0.5" opacity="0.3" />
                    </pattern>
                </defs>

                <!-- 網格背景 -->
                <rect x="-5000" y="-5000" width="10000" height="10000" fill="url(#grid)" />

                <!-- 圖層 -->
                <g id="frameLayer"></g>
                <g id="connectionLayer"></g>
                <g id="nodeLayer"></g>
                <g id="selectionLayer"></g>
            </svg>
        </div>
    </div>

    <!-- 右鍵選單 -->
    <div class="context-menu" id="contextMenu" style="display: none;">
        <div class="context-menu-item" data-action="edit">✏️ 編輯</div>
        <div class="context-menu-item" data-action="link">🔗 設定連結</div>
        <div class="context-menu-divider"></div>
        <div class="context-menu-item" data-action="status-normal">⭕ 正常</div>
        <div class="context-menu-item" data-action="status-complete">✅ 已完成</div>
        <div class="context-menu-item" data-action="status-abandoned">❌ 已放棄</div>
        <div class="context-menu-divider"></div>
        <div class="context-menu-item" data-action="delete">🗑️ 刪除</div>
    </div>

    <!-- 對話框容器 -->
    <div id="dialogContainer"></div>

    <!-- 錯誤處理與除錯 -->
    <script>
        window.addEventListener('error', function (e) {
            alert('發生錯誤: ' + e.message + '\n於: ' + e.filename + ':' + e.lineno);
        });
        window.addEventListener('unhandledrejection', function (e) {
            alert('未捕捉的 Promise 錯誤: ' + e.reason);
        });
    </script>

    <!-- 載入所有模組 -->
    <script type="module" src="app.js"></script>
</body>

</html>
